<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaTech | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/styleLogin.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <!--Header-->

        <div class="header">
        <div class="container">
            <h1 class="titulo"><img src="./assets/icon/LOGO .svg" alt=""></h1>
            <ul class="navbar">
                <li><a href="index.html">Inicial</a></li>
                <li><a href="simulador.html">Simulador</a></li>
                <li></li>
                <li class="agora"><a href="login.html">Login</a></li>
            </ul>
        </div>
    </div>

    <!--Conteúdo Principal-->
    <main class="conteudo">
        <div class="login-container" id="container">
            <div class="form-container registrar">
                <form>
                    <h1>Crie sua Conta</h1>
                    <span>Use seu email para se registrar</span>
                    <input type="text" id="input_nome" placeholder="Nome">
                    <span id="validacao_nome" class="msg_validacao"></span>

                    <input type="text" id="input_email_cadastro"placeholder="Email">
                    <span id="validacao_email" class="msg_validacao"></span>

                    <input type="password" id="input_senha_cadastro" placeholder="Senha">
                    <span id="validacao_senha" class="msg_validacao"></span>

                    <input type="password" id="input_senha_confirmada" placeholder="Confirme sua Senha">
                    <span id="validacao_confSenha" class="msg_validacao"></span>
                    
                    <button type="button" onclick="cadastrar()">Criar</button>
                </form>
            </div>
            <div class="form-container entrar">
                <form>
                    <h1>Acesse sua Conta</h1>
                    <span>Acesse com Email e Senha</span>
                    <input type="text" id="input_email_login" placeholder="Email">
                    <span id="validacao_email_login" class="msg_validacao"></span>

                    <input type="password" id="input_senha_login" placeholder="Senha">
                    <span id="validacao_senha_login" class="msg_validacao"></span>

                    <a href="#">Esqueceu sua Senha?</a>
                    <button type="button" onclick="entrar()">Login</button>
                </form>
            </div>
            <div class="mudanca-container">
                <div class="mudanca">
                    <div class="painel-mudanca mudanca-esquerda">
                        <h1>Já possui cadastro?</h1>
                        <p>Faça login para monitorar sua infraestrutura</p>
                        <button class="hidden" id="login" type="button">Login</button>
                    </div>
                    <div class="painel-mudanca mudanca-direita">
                        <h1>Não possui cadastro?</h1>
                        <p>Cadastre a sua conta para aceder ao sistema de monitorização</p>
                        <button class="hidden" id="registrar" type="button">Cadastrar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    
    <script src="./js/script.js"></script>

</body>

</html>
