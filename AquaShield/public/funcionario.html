<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário</title>
    <link rel="stylesheet" href="./css/funcionario.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/popup.css">
    <script src="./js/popup.js" defer></script>
</head>

<body onload="validarSessao(true)">
    <input type="checkbox" id="control-menu">

    <nav class="sidebar">
        <label for="control-menu" class="btn-menu">
            <i class="bi bi-list"></i>
        </label>

        <div class="menu_icones">
            <ul>
                <li><a href="inicio.html"><i class="bi bi-house"></i><span>Início</span></a></li>
                <li><a href="dash_principal.html"><i class="bi bi-grid"></i><span>Visão geral</span></a></li>
                <li><a href="maquinas.html"><i class="bi bi-display"></i><span>Máquinas</span></a></li>
                <li><a href="suporte.html"><i class="bi bi-question-circle"></i><span>Suporte</span></a></li>
                <li><a href="funcionario.html"><i class="bi bi-person-plus"></i><span>Cadastro de funcionário</span></a>
                </li>
                <li><a href="cadastro_cco.html"><i class="bi bi-building-add"></i><span>Cadastro de CCO</span></a></li>
                <li><a href="historico.html"><i class="bi bi-clock-history"></i><span>Histórico</span></a></li>
                <li><a href="configuracoes.html"><i class="bi bi-gear"></i><span>Configurações</span></a></li>
                <li class="item-sair">
                    <a href="#" onclick="deslogar()">
                        <i class="bi bi-box-arrow-left"></i>
                        <span>Sair da Conta</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="area-direita">
        <header class="header">
            <div class="logo">
                <img src="assets/icon/LOGO .svg" alt="Logo">
            </div>
            <div class="usuario">
                <strong id="b_usuario">Nome</strong>
                <span id="b_cargo">Cargo</span>
            </div>
        </header>

        <div class="conteudo" style="flex-direction: column; padding-bottom: 32px;">
            <div class="login-container" id="container">
                <div class="form-container registrar">
                    <form id="form_funcionario">
                        <h1 id="titulo_funcionario">Cadastro de Funcionário</h1>
                        <span>Preencha as informações para realizar o cadastro</span>

                        <input type="text" id="input_nome" placeholder="Nome Completo">
                        <span id="validacao_nome" class="msg_validacao"></span>

                        <input type="text" id="input_email_cadastro" placeholder="Email Corporativo">
                        <span id="validacao_email" class="msg_validacao"></span>

                        <input type="text" id="input_telefone" placeholder="Telefone (ex: 11999998888)" maxlength="11">
                        <span id="validacao_telefone" class="msg_validacao"></span>

                        <select id="select_cargo" class="input-select">
                            <option value="" disabled selected>Selecione o Cargo/Função</option>
                            <option value="1">Gestor</option>
                            <option value="2">Analista</option>
                            <option value="3">Operador</option>
                        </select>
                        <span id="validacao_cargo" class="msg_validacao"></span>

                        <input type="password" id="input_senha_provisoria" placeholder="Senha Provisória">
                        <span id="validacao_senha" class="msg_validacao"></span>

                        <button type="button" id="btn_criar" onclick="cadastrarFuncionario()">Criar</button>
                        <button type="button" id="btn_salvar" onclick="salvarEdicao()" style="display: none;">Salvar
                            Alterações</button>
                        <button type="button" id="btn_cancelar" onclick="cancelarEdicao()"
                            style="display: none; background-color: #6f8392; margin-top: 8px;">Cancelar</button>
                    </form>
                </div>
            </div>

            <div class="card-lista-cco">
                <h2>Funcionários Cadastrados</h2>
                <p id="msg_vazio" style="color: #6f8392; margin-top: 10px;">Nenhum funcionário cadastrado.</p>
                <div id="lista_funcionarios"></div>
            </div>

            <template id="molde_funcionario">
                <div class="item-cco">
                    <div>
                        <strong class="func-nome"></strong>
                        <p class="func-detalhes"></p>
                    </div>
                    <div class="acoes-cco">
                        <button type="button" class="btn-editar" title="Editar"><i
                                class="bi bi-pencil-square"></i></button>
                        <button type="button" class="btn-excluir" title="Excluir"><i class="bi bi-trash3"></i></button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script src="./js/funcionario.js"></script>
</body>

</html>
