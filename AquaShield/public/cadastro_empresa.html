<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/cadastro_suporte.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>
<body>
<main class="conteudo">
        <div class="container-cadastro">
            
            <!-- Passos do Cadastro -->
            <div class="cabecalho-etapas">
                <div class="indicador-etapa" id="indicador_etapa_1">
                    <div class="circulo-etapa" id="circulo_etapa_1" style="background-color: #1f99ac; color: #fff;">1</div>
                    <span id="texto_etapa_1" style="color: #1f99ac;">Empresa</span>
                </div>
                <div class="linha-etapa"></div>
                <div class="indicador-etapa" id="indicador_etapa_2">
                    <div class="circulo-etapa" id="circulo_etapa_2">2</div>
                    <span id="texto_etapa_2">CCO</span>
                </div>
                <div class="linha-etapa"></div>
                <div class="indicador-etapa" id="indicador_etapa_3">
                    <div class="circulo-etapa" id="circulo_etapa_3">3</div>
                    <span id="texto_etapa_3">Gestor</span>
                </div>
            </div>

            <!-- Formulário -->
            <div class="container-formulario">
                <form id="form_cadastro_empresa">
                    
                    <!-- ETAPA 1: Empresa -->
                    <div class="bloco-etapa" id="etapa_empresa">
                        <h1>Dados da Empresa</h1>
                        <span>Insira os dados jurídicos da Empresa</span>
                        
                        <input type="text" id="input_razao_social" placeholder="Razão Social">
                        <span id="validacao_razao" class="msg_validacao"></span>

                        <input type="text" id="input_nome_fantasia" placeholder="Nome Fantasia">
                        <span id="validacao_fantasia" class="msg_validacao"></span>

                        <input type="text" id="input_cnpj" placeholder="CNPJ (apenas números)">
                        <span id="validacao_cnpj" class="msg_validacao"></span>

                        <div class="botoes-etapa">
                            <button type="button" onclick="avancarEtapa2()">Avançar &rarr;</button>
                        </div>
                    </div>

                    <!-- ETAPA 2: CCO -->
                    <div class="bloco-etapa" id="etapa_cco" style="display: none;">
                        <h1>Estrutura Inicial</h1>
                        <span>Configure o Centro de Controle e localização</span>
                        
                        <input type="text" id="input_nome_cco" placeholder="Nome do CCO (ex: CCO SP)">
                        <span id="validacao_cco" class="msg_validacao"></span>

                        <input type="text" id="input_cep_cco" placeholder="CEP">
                        <span id="validacao_cep" class="msg_validacao"></span>
                        
                        <div class="grupo-inputs">
                            <input type="text" id="input_uf_cco" placeholder="UF" maxlength="2">
                            <input type="text" id="input_pais_cco" placeholder="País" value="Brasil">
                        </div>
                        <span id="validacao_uf" class="msg_validacao"></span>

                        <div class="botoes-etapa">
                            <button type="button" class="btn-voltar" onclick="voltarEtapa1()">&larr; Voltar</button>
                            <button type="button" onclick="avancarEtapa3()">Avançar &rarr;</button>
                        </div>
                    </div>

                    <!-- ETAPA 3: Gestor -->
                    <div class="bloco-etapa" id="etapa_gestor" style="display: none;">
                        <h1>Gestor Responsável</h1>
                        <span>Credenciais para o primeiro acesso à plataforma</span>
                        
                        <input type="text" id="input_nome_gestor" placeholder="Nome Completo do Gestor">
                        <span id="validacao_nome_gestor" class="msg_validacao"></span>

                        <input type="email" id="input_email_gestor" placeholder="E-mail Corporativo">
                        <span id="validacao_email_gestor" class="msg_validacao"></span>

                        <input type="password" id="input_senha_gestor" placeholder="Senha Provisória">
                        <span id="validacao_senha_gestor" class="msg_validacao"></span>

                        <div class="botoes-etapa">
                            <button type="button" class="btn-voltar" onclick="voltarEtapa2()">&larr; Voltar</button>
                            <button type="button" onclick="cadastrarEmpresa()">Concluir Cadastro</button>
                        </div>
                    </div>

                </form>
            </div>

        </div>
    </main>

    <script src="./js/cadastro_empresa.js"></script>
</body>
</html>
