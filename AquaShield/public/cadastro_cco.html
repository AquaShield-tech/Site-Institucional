<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário</title>
    <script src="./js/script.js"></script>
    <link rel="stylesheet" href="./css/funcionario.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body onload="validarSessao()">
    <input type="checkbox" id="control-menu">

    <nav class="sidebar">
        <label for="control-menu" class="btn-menu">
            <i class="bi bi-list"></i>
        </label>

        <div class="menu_icones">
            <ul>
                <li><a href="inicio.html"><i class="bi bi-house"></i><span>Início</span></a></li>
               <li><a href="dash_principal.html"><i class="bi bi-grid"></i><span>Visão geral</span></a></li>
                <li><a href="maquinas.html"><i class="bi bi-display"></i><span>Máquinas</span></a></li>
                <li><a href="suporte.html"><i class="bi bi-question-circle"></i><span>Suporte</span></a></li>
                <li><a href="funcionario.html"><i class="bi bi-person-plus"></i><span>Cadastro de funcionário</span></a></li>
                <li><a href="cadastro_cco.html"><i class="bi bi-building-add"></i><span>Cadastro de CCO</span></a></li>
                <li><a href="historico.html"><i class="bi bi-clock-history"></i><span>Histórico</span></a></li>
                <li><a href="configuracoes.html"><i class="bi bi-gear"></i><span>Configurações</span></a></li>
                <li class="item-sair">
                    <a href="#" onclick="deslogar()">
                        <i class="bi bi-box-arrow-left"></i>
                        <span>Sair da Conta</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="area-direita">
        <header class="header">
            <div class="logo">
                <img src="assets/icon/LOGO .svg" alt="Logo">
            </div>
            <div class="usuario">
                <strong id="b_usuario">Gestor</strong>
                <span>Gestor</span>
            </div>
        </header>

        <div class="conteudo">
            <div class="login-container" id="container">
                <div class="form-container registrar">
                    <form id="form_funcionario">
                        <h1>Cadastro de CCO</h1>
                        <span>Preencha as informações para realizar o cadastro</span>
                        
                        <input type="text" id="input_nome" placeholder="Nome">
                        <span id="validacao_nome" class="msg_validacao"></span>

                        <input type="text" id="input_pais" placeholder="País (ex: Brasil)">
                        <span id="validacao_pais" class="msg_validacao"></span>

                        <input type="text" id="input_cep" placeholder="CEP (apenas números)" maxlength="8">
                        <span id="validacao_cep" class="msg_validacao"></span>

                        <input type="text" id="input_uf" placeholder="UF (ex: SP)" maxlength="2">
                        <span id="validacao_uf" class="msg_validacao"></span>

                        <button type="button" onclick="cadastrarCco()">Criar CCO</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script src="./js/cadastro_cco.js"></script>
