<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Login Site Institucional | AquaShield</title>
</head>
<body>
    
    <div class="container" id="container">
        <div class="form-container registrar">
            <form >
                <h1>Crie sua Conta</h1>
                <span>use your email for registration</span>
                <input type="text" placeholder="Nome">
                <input type="text" placeholder="Email">
                <input type="text" placeholder="Senha">
            <button>Criar</button>
            </form>
        </div>
        <div class="form-container entrar">
            <form >
                <h1>Acesse sua Conta</h1>
                <span>Acesse com Email e Senha</span>
                <input type="text" placeholder="Email">
                <input type="text" placeholder="Senha">
                <a href="#">Esqueceu sua Senha?</a>
            <button>Login</button>
            </form>
        </div>
        <div class="mudanca-container">
            <div class="mudanca">
                <div class="painel-mudanca mudanca-esquerda">
                    <h1>Boas Vindas!</h1>
                    <p>Insira seus Dados para usar todas as funcionalidades do Site</p>
                    <button class="hidden" id="login">Acessar</button>
                </div>
                <div class="painel-mudanca mudanca-direita">
                    <h1>Boas Vindas!</h1>
                    <p>Registre seus Dados para usar todas as funcionalidades do Site</p>
                    <button class="hidden" id="registrar">Registrar</button>
                </div>
            </div>
        </div>
    </div>

    

    <script src="script.js"></script>
</body>
</html>
